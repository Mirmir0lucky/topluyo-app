<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Güncelleme</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #f2eef3;
      --muted: #9d93a1;
      --line: #332b35;
      --accent: #d43ca3;
      --accent2: #7a2a86;
      --err: #ff7a9c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #171416 0%, #1f1820 45%, #2c1a2e 80%, #35153a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box { padding: 28px; width: 100%; }
    .badge {
      display: inline-block; font-size: 11px; letter-spacing: 0.1em;
      color: var(--accent); border: 1px solid var(--accent);
      padding: 3px 8px; border-radius: 999px; margin-bottom: 12px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
    .err { color: var(--err); font-size: 13px; }
    .hidden { display: none !important; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; }
    .btn {
      border: 1px solid var(--line); background: transparent; color: var(--text);
      padding: 10px 16px; border-radius: 10px; font-size: 14px; cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.primary {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border: 0; color: #fff;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge">GÜNCELLEME</div>
    <h1>Yeni sürüm hazır</h1>
    <p id="text">Topluyo'nun yeni sürümü indirilip kurulabilir. Şimdi yüklemek ister misin?</p>
    <p id="err" class="err hidden"></p>
    <div class="actions">
      <button id="later" class="btn">Sonra</button>
      <button id="now" class="btn primary">Şimdi yükle</button>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const text = document.getElementById('text');
    const err = document.getElementById('err');
    const later = document.getElementById('later');
    const now = document.getElementById('now');

    later.addEventListener('click', () => invoke('postpone_update'));

    now.addEventListener('click', async () => {
      later.disabled = true;
      now.disabled = true;
      now.textContent = 'İndiriliyor…';
      err.classList.add('hidden');
      try {
        await invoke('install_update');
      } catch (e) {
        err.textContent = 'Güncelleme kurulamadı: ' + e;
        err.classList.remove('hidden');
        later.disabled = false;
        now.disabled = false;
        now.textContent = 'Şimdi yükle';
      }
    });

    invoke('pending_update_version').then((v) => {
      if (v) {
        text.textContent = 'Topluyo ' + v + ' sürümü indirilip kurulabilir. Şimdi yüklemek ister misin?';
      }
    });
  </script>
</body>
</html>
