<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Güncelleme</title>
  <style>
    :root {
      color-scheme: dark;
      --card: #1c1a1e;
      --field: #17151a;
      --line: #2c2830;
      --text: #f2f0f3;
      --muted: #8f8896;
      --accent: #e012b5;
      --accent-hover: #c40ea0;
      --err: #ff7a9c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--card);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    .head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    h1 { font-size: 18px; font-weight: 700; margin: 0; }
    .x {
      background: transparent; border: 0; color: var(--muted);
      font-size: 22px; line-height: 1; cursor: pointer;
      padding: 4px 9px; border-radius: 8px;
    }
    .x:hover { color: var(--text); background: var(--field); }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 14px; }
    .err { color: var(--err); font-size: 13px; }
    .hidden { display: none !important; }
    .actions {
      margin-top: auto;
      display: flex; justify-content: flex-end; gap: 10px;
    }
    .btn {
      background: var(--field); color: var(--text);
      border: 1px solid var(--line); padding: 10px 18px;
      border-radius: 10px; font-size: 14px; cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="head">
    <h1>Yeni sürüm hazır</h1>
    <button class="x" id="close" title="Kapat">×</button>
  </div>
  <p id="text">Topluyo'nun yeni sürümü indirilip kurulabilir. Şimdi yüklemek ister misin?</p>
  <p id="err" class="err hidden"></p>
  <div class="actions">
    <button id="later" class="btn">Sonra</button>
    <button id="now" class="btn primary">Şimdi yükle</button>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const text = document.getElementById('text');
    const err = document.getElementById('err');
    const later = document.getElementById('later');
    const now = document.getElementById('now');

    later.addEventListener('click', () => invoke('postpone_update'));
    document.getElementById('close').addEventListener('click', () => invoke('close_current_window'));

    now.addEventListener('click', async () => {
      later.disabled = true;
      now.disabled = true;
      now.textContent = 'İndiriliyor…';
      err.classList.add('hidden');
      try {
        await invoke('install_update');
      } catch (e) {
        err.textContent = 'Güncelleme kurulamadı: ' + e;
        err.classList.remove('hidden');
        later.disabled = false;
        now.disabled = false;
        now.textContent = 'Şimdi yükle';
      }
    });

    invoke('pending_update_version').then((v) => {
      if (v) {
        text.textContent = 'Topluyo ' + v + ' sürümü indirilip kurulabilir. Şimdi yüklemek ister misin?';
      }
    });
  </script>
</body>
</html>
