<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topluyo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141215;
      --card: #1c1a1e;
      --text: #f2f0f3;
      --muted: #8f8896;
      --line: #2c2830;
      --accent: #e012b5;
      --accent-hover: #c40ea0;
      --err: #ff7a9c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      user-select: none;
    }
    .card {
      width: min(340px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .hidden { display: none !important; }
    .logo {
      display: block;
      width: 44px; height: 44px;
      margin: 0 auto 12px;
      border-radius: 10px;
    }
    .row { display: flex; align-items: center; gap: 12px; }
    .spinner {
      flex: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot {
      flex: none;
      width: 10px; height: 10px;
      margin: 0 5px;
      border-radius: 50%;
      background: var(--err);
    }
    .title { font-size: 14px; font-weight: 700; }
    .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .btn {
      background: var(--accent); color: #fff; border: 0;
      padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="Topluyo" onerror="this.remove()" />
    <div id="loading" class="row">
      <div class="spinner"></div>
      <div>
        <div class="title">Bağlanıyor…</div>
      </div>
    </div>

    <div id="offline" class="hidden">
      <div class="row">
        <div class="dot"></div>
        <div>
          <div class="title">Bağlantın yok</div>
          <div class="sub" id="status"></div>
        </div>
      </div>
      <div class="actions">
        <button id="retry" class="btn">Şimdi dene</button>
      </div>
    </div>
  </div>

  <script>
    const SITE = 'https://topluyo.com/';
    const RETRY_SECONDS = 15;
    const TIMEOUT_MS = 8000;

    const loading = document.getElementById('loading');
    const offline = document.getElementById('offline');
    const status = document.getElementById('status');
    const retryBtn = document.getElementById('retry');

    let ticker = null;
    let remaining = RETRY_SECONDS;
    let busy = false;

    function stopTicker() {
      clearInterval(ticker);
      ticker = null;
    }

    function showOffline() {
      loading.classList.add('hidden');
      offline.classList.remove('hidden');
      retryBtn.disabled = false;
    }

    function showCountdown() {
      status.textContent = remaining + ' saniye içinde tekrar denenecek';
    }

    // Her saniye geri sayar, 0 olunca otomatik dener
    function waitThenRetry() {
      stopTicker();
      remaining = RETRY_SECONDS;
      showCountdown();
      ticker = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          tryOpen();
        } else {
          showCountdown();
        }
      }, 1000);
    }

    async function tryOpen() {
      if (busy) return;
      busy = true;
      stopTicker();

      // Pencere zaten çevrimdışı görünümdeyse aynı kartta "deneniyor" yazısı göster
      if (!offline.classList.contains('hidden')) {
        status.textContent = 'Deneniyor…';
        retryBtn.disabled = true;
      }

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
      try {
        await fetch(SITE, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
        clearTimeout(timer);
        location.replace(SITE);
      } catch (e) {
        clearTimeout(timer);
        busy = false;
        showOffline();
        waitThenRetry();
      }
    }

    retryBtn.addEventListener('click', tryOpen);
    window.addEventListener('online', tryOpen);
    tryOpen();
  </script>
</body>
</html>
