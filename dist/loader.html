<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topluyo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141215;
      --text: #f2f0f3;
      --muted: #8f8896;
      --line: #2c2830;
      --accent: #e012b5;
      --accent-hover: #c40ea0;
    }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    }
    .box { text-align: center; padding: 24px; }
    .hidden { display: none !important; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 16px;
      border-radius: 50%;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
    p { color: var(--muted); font-size: 14px; margin: 6px 0 18px; }
    .btn {
      background: var(--accent); color: #fff; border: 0;
      padding: 10px 22px; border-radius: 10px; font-size: 14px; cursor: pointer;
    }
    .btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="box">
    <div id="loading">
      <div class="spinner"></div>
      <p>Topluyo yükleniyor…</p>
    </div>
    <div id="offline" class="hidden">
      <h1>Bağlantı yok</h1>
      <p>İnternet bağlantını kontrol edip tekrar dene.</p>
      <button id="retry" class="btn">Tekrar dene</button>
    </div>
  </div>

  <script>
    const SITE = 'https://topluyo.com/';
    const loading = document.getElementById('loading');
    const offline = document.getElementById('offline');

    async function tryOpen() {
      loading.classList.remove('hidden');
      offline.classList.add('hidden');

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        await fetch(SITE, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
        clearTimeout(timer);
        location.replace(SITE);
      } catch (e) {
        clearTimeout(timer);
        loading.classList.add('hidden');
        offline.classList.remove('hidden');
      }
    }

    document.getElementById('retry').addEventListener('click', tryOpen);
    window.addEventListener('online', tryOpen);
    tryOpen();
  </script>
</body>
</html>
