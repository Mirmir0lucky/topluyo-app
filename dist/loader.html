<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topluyo</title>
  <style>
    :root {
      color-scheme: dark;
      --card: #1c1a1e;
      --text: #f2f0f3;
      --muted: #8f8896;
      --line: #2c2830;
      --accent: #e012b5;
      --accent-hover: #c40ea0;
      --err: #ff7a9c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--card);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      border: 1px solid var(--line);
      user-select: none;
      cursor: default;
    }
    .hidden { display: none !important; }
    .logo {
      width: 44px; height: 44px;
      border-radius: 10px;
      pointer-events: none;
    }
    .panel { width: 100%; padding: 0 22px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .spinner {
      flex: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot {
      flex: none;
      width: 9px; height: 9px;
      margin: 0 4px;
      border-radius: 50%;
      background: var(--err);
    }
    .title { font-size: 14px; font-weight: 700; }
    .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .actions { display: flex; justify-content: center; margin-top: 10px; }
    .btn {
      background: var(--accent); color: #fff; border: 0;
      padding: 7px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <img id="logo" class="logo" src="logo.gif" alt="Topluyo" onerror="this.remove()" />
  <img id="crying" class="logo hidden" src="crying-logo.png" alt="Topluyo" onerror="this.remove()" />

  <div id="loading" class="panel row" style="justify-content:center">
    <div class="spinner"></div>
    <div class="title">Bağlanıyor…</div>
  </div>

  <div id="offline" class="panel hidden">
    <div class="row" style="justify-content:center">
      <div class="dot"></div>
      <div style="text-align:center">
        <div class="title" id="title">Bağlantın yok</div>
        <div class="sub" id="status"></div>
      </div>
    </div>
    <div class="actions">
      <button id="retry" class="btn">Şimdi dene</button>
    </div>
  </div>

  <script>
    const SITE = 'https://topluyo.com/';
    const RETRY_SECONDS = 15;

    const loading = document.getElementById('loading');
    const offline = document.getElementById('offline');
    const status = document.getElementById('status');
    const titleEl = document.getElementById('title');
    const retryBtn = document.getElementById('retry');

    let ticker = null;
    let remaining = RETRY_SECONDS;
    let busy = false;

    function stopTicker() {
      clearInterval(ticker);
      ticker = null;
    }

    // Çevrimdışı ve hata durumunda normal logo yerine üzgün logo
    function showOffline() {
      loading.classList.add('hidden');
      offline.classList.remove('hidden');
      retryBtn.disabled = false;
      const logoEl = document.getElementById('logo');
      const cryingEl = document.getElementById('crying');
      if (logoEl) logoEl.classList.add('hidden');
      if (cryingEl) cryingEl.classList.remove('hidden');
    }

    function showCountdown() {
      status.textContent = remaining + ' saniye içinde tekrar denenecek';
    }

    // Her saniye geri sayar, 0 olunca otomatik dener
    function waitThenRetry() {
      stopTicker();
      remaining = RETRY_SECONDS;
      showCountdown();
      ticker = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          tryOpen();
        } else {
          showCountdown();
        }
      }, 1000);
    }

    async function tryOpen() {
      if (busy) return;
      busy = true;
      stopTicker();

      // Kart zaten çevrimdışı görünümdeyse aynı kartta "deneniyor" yazısı göster
      if (!offline.classList.contains('hidden')) {
        status.textContent = 'Deneniyor…';
        retryBtn.disabled = true;
      }

      // Kontrol Rust tarafında yapılır (TCP 443). Webview ağına ve CORS'a takılmaz.
      let result = 'offline';
      try {
        result = await window.__TAURI__.core.invoke('check_site');
        if (result === 'ok') {
          // Bağlantı var: asıl pencereyi aç, bu küçük pencereyi kapat (Rust tarafı yapar)
          await window.__TAURI__.core.invoke('site_connected');
          return;
        }
      } catch (e) {
        // Komut hata verirse çevrimdışı say
      }
      titleEl.textContent = result === 'server' ? 'Topluyo şu an yanıt vermiyor' : 'Bağlantın yok';
      busy = false;
      showOffline();
      waitThenRetry();
    }

    // Çerçevesiz pencere: boş alana basılınca pencere sürüklenir
    document.addEventListener('mousedown', (e) => {
      if (e.button === 0 && !e.target.closest('button')) {
        window.__TAURI__.window.getCurrentWindow().startDragging();
      }
    });

    retryBtn.addEventListener('click', tryOpen);
    window.addEventListener('online', tryOpen);
    tryOpen();
  </script>
</body>
</html>
