name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Release oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --title "Topluyo v$VERSION" \
            --notes "Commit: ${{ github.sha }}" \
            --target "${{ github.sha }}" || true

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
            rust: ""
          - os: windows-latest
            args: ""
            rust: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: Sürüm numarasını ayarla
        run: node scripts/set-version.js
        env:
          VERSION: ${{ env.VERSION }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: Topluyo v${{ env.VERSION }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
